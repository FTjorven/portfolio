name: Deploy to GitHub Pages

# The same code lives in two repos, and each one publishes a different site:
#   FTjorven/portfolio -> visual design site     (ftjorven.github.io/portfolio/)
#   FTjorven/work      -> creative development site (ftjorven.github.io/work/)
# Push to both remotes to update both sites.

on:
  # Deploy every time you push to main
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE: ${{ github.event.repository.name == 'work' && 'creative' || 'visual' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:${{ env.SITE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/${{ env.SITE }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
