name: Deploy to GitHub Pages

# The same code lives in three repos, and each one publishes a different site:
#   FTjorven/portfolio -> combined site             (ftjorven.github.io/portfolio/)
#   FTjorven/work      -> creative development site (ftjorven.github.io/work/)
#   FTjorven/projects  -> visual design site        (ftjorven.github.io/projects/)
# Push to all three remotes to update all sites.

on:
  # Deploy every time you push to main
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE: ${{ github.event.repository.name == 'work' && 'creative' || github.event.repository.name == 'projects' && 'visual' || 'all' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:${{ env.SITE }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/${{ env.SITE }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url || steps.retry2.outputs.page_url }}
    steps:
      # Pushing twice within a few minutes can fail with "in progress deployment":
      # GitHub is still finishing the previous one, sometimes for 10+ minutes.
      # So: try, wait 2 minutes, try again, wait 5 more minutes, try a last time.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait for the previous deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 120
      - name: Deploy to GitHub Pages (retry)
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait a bit longer
        if: steps.deployment.outcome == 'failure' && steps.retry.outcome == 'failure'
        run: sleep 300
      - name: Deploy to GitHub Pages (last try)
        id: retry2
        if: steps.deployment.outcome == 'failure' && steps.retry.outcome == 'failure'
        uses: actions/deploy-pages@v5
